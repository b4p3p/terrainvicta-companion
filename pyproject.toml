[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terrainvicta-companion"
version = "0.1.0"
description = "Second-screen companion for Terra Invicta: reads your save file and shows council, missions and nations while you play."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "b4p3p" }]
keywords = ["terra-invicta", "gaming", "companion", "savegame", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Estrae le icone del gioco dai bundle Unity dell'installazione locale.
# Senza, l'interfaccia resta testuale: nessuna funzione si rompe.
icons = ["UnityPy>=1.20", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/b4p3p/terrainvicta-companion"
Issues = "https://github.com/b4p3p/terrainvicta-companion/issues"

[project.scripts]
ti = "ti:main"

[tool.setuptools]
packages = ["ticore", "tiserver"]
py-modules = ["ti"]
